---
ru:
  date:
    formats:
      default: "%d.%m.%Y"
      short: "%d %b"
      long: "%d %B %Y"
    day_names: [воскресенье, понедельник, вторник, среда, четверг, пятница, суббота]
    abbr_day_names: [вс, пн, вт, ср, чт, пт, сб]
    month_names:
      - ~
      - января
      - февраля
      - марта
      - апреля
      - мая
      - июня
      - июля
      - августа
      - сентября
      - октября
      - ноября
      - декабря
    abbr_month_names:
      - ~
      - янв.
      - февр.
      - марта
      - апр.
      - мая
      - июня
      - июля
      - авг.
      - сент.
      - окт.
      - нояб.
      - дек.

  time:
    formats:
      default: "%d.%m.%Y %H:%M:%S"
      short: "%d.%m %H:%M"
      long: "%d %B %Y, %H:%M:%S"
    am: утра
    pm: вечера

  support:
    array:
      words_connector: ", "
      two_words_connector: " и "
      last_word_connector: " и "

  number:
    format:
      separator: ","
      delimiter: " "
      precision: 2

  views:
    pagination:
      first: "« Первая"
      last: "Последняя »"
      previous: "‹ Предыдущая"
      next: "Следующая ›"
      truncate: "…"

  activerecord:
    models:
      receipt:
        one: Чек
        few: Чека
        many: Чеков
        other: Чеки
      event:
        one: Событие
        few: События
        many: Событий
        other: События
    attributes:
      receipt:
        attachment_id: Correlation-id (attachment_id)
        file: Файл
        full_path: Путь в S3
        price: Стоимость
        last_action: Последнее действие
        events_count: Событий
        failed_events_count: Ошибок
        first_event_at: Первое событие
        last_event_at: Последнее событие
        duration: Длительность
        created_at: Создан
        updated_at: Обновлён
      event:
        receipt: Чек
        attachment_id: Correlation-id (attachment_id)
        action: Действие
        routing_key: Ключ маршрутизации
        source: Микросервис-источник
        data: Сообщение
        occurred_at: Время события
        success: Успех
        error_message: Ошибка
        error_backtrace: Стектрейс ошибки
        created_at: Зарегистрировано
        updated_at: Обновлено

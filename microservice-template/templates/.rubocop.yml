# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
- rubocop-performance
- rubocop-rails
- rubocop-rspec

Rails:
  Enabled: true

Rails/FilePath:
  EnforcedStyle: arguments

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Layout/LineLength:
  AutoCorrect: true
  Max: 100
  AllowedPatterns: ['(\A|\s)#']

Style/FrozenStringLiteralComment:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Metrics/AbcSize:
  Max: 30

Metrics/BlockLength:
  Max: 200
  Exclude:
    - 'app/admin/**/*'
    - 'Rakefile'
    - '**/*.rake'
    - 'spec/**/*'

Rails/HttpPositionalArguments:
  Exclude:
    - 'spec/**/*'

AllCops:
  Exclude:
    - 'tmp/**/*'
    - 'db/**/*'
    - 'bin/**/*'
    - 'vendor/bundle/**/*'
    - 'docs/**/*'

# кол-во строк в блоке it или specify
RSpec/ExampleLength:
  Max: 10

# описания спеков пишутся на русском
RSpec/ContextWording:
  Prefixes:
    - когда
    - если
    - для
    - при
    - с
    - без

RSpec/MultipleExpectations:
  Max: 5

# спек воркера держит subject, сообщение и три параметра доставки — шесть let'ов
RSpec/MultipleMemoizedHelpers:
  Max: 6

# воркеру Sneakers методы ack!/reject!/requeue! достаются от фреймворка:
# проверить их вызов можно только подменой у объекта под тестом
RSpec/SubjectStub:
  Exclude:
    - 'spec/workers/**/*'

# omakase требует пробелы внутри скобок массива ([ 1, 2 ]), в проекте принята
# обычная запись [1, 2] — пробелы в хеш-литералах при этом сохраняются
Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

# пустой блок записывается как {} (идиома dry-initializer: `default: -> {}`)
Layout/SpaceInsideBlockBraces:
  EnforcedStyleForEmptyBraces: no_space

# lib/tracing и lib/metrics вынесены из автозагрузки и не опираются на ActiveSupport
Rails/Delegate:
  Exclude:
    - 'lib/tracing/**/*'
    - 'lib/metrics/**/*'

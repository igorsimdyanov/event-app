services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    # Обязательно вместе с томом: брокер хранит данные в каталоге, названном
    # по имени узла (rabbit@<hostname>). У пересозданного контейнера hostname
    # новый, и без этой строки брокер завёл бы пустой узел рядом со старым
    hostname: rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
      # Метрики плагина rabbitmq_prometheus: Prometheus берёт их внутри сети,
      # порт наружу нужен только для проверки руками
      - "15692:15692"
    volumes:
      # Очереди, обменники, привязки и накопленные сообщения переживают
      # пересоздание контейнера. RabbitMQ 4.x пишет на диск и сообщения,
      # опубликованные без флага persistent
      - rabbitmq-data:/var/lib/rabbitmq
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Перечитать конфигурацию без перезапуска контейнера:
      # curl -X POST http://localhost:9090/-/reload
      - --web.enable-lifecycle
      # sort_by_label в дашбордах Grafana: без него порядок плашек в панелях
      # меняется от обновления к обновлению
      - --enable-feature=promql-experimental-functions
    ports:
      - 9090:9090
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - rabbitmq
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
      GF_SECURITY_ADMIN_USER: 'admin'
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      # Как и панели ActiveAdmin, стенд открыт без авторизации: дашборды
      # видны сразу, вход нужен только чтобы что-то изменить
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_USERS_DEFAULT_LANGUAGE: 'ru-RU'
      # Стартовая страница — «Обзор системы» со ссылками на остальные дашборды,
      # вместо приветственного экрана Grafana
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/var/lib/grafana/dashboards/overview.json'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    hostname: zipkin
    ports:
      - 9411:9411
    restart: unless-stopped
    environment:
      TZ: "Europe/Moscow"
      # Трассы лежат в памяти процесса и пропадают с перезапуском контейнера:
      # на стенде они живут минуты, а внешнее хранилище (Elasticsearch,
      # Cassandra) стоило бы дороже самого конвейера
      STORAGE_TYPE: 'mem'
      MEM_MAX_SPANS: '500000'
  inbox:
    tty: true
    stdin_open: true
    image: inbox
    container_name: inbox
    build:
      context: ./inbox
    env_file:
      ./inbox/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS_JSON: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: >
      sh -c "bundle exec bin/jobs"
    volumes:
      - ./inbox:/rails
  check-manager:
    tty: true
    stdin_open: true
    image: check-manager
    container_name: check-manager
    build:
      context: ./check-manager
    ports:
      - '8001:3000'
    env_file:
      ./check-manager/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./check-manager:/rails
  check-manager-sneakers:
    tty: true
    stdin_open: true
    image: check-manager-sneakers
    container_name: check-manager-sneakers
    build:
      context: ./check-manager
    env_file:
      ./check-manager/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: sh -c "sleep 10 && bundle exec rails sneakers:run"
    volumes:
      - ./check-manager:/rails
  tesseract-sneakers:
    tty: true
    stdin_open: true
    image: tesseract-sneakers
    container_name: tesseract-sneakers
    build:
      context: ./tesseract
    env_file:
      ./tesseract/.env
    environment:
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - rabbitmq
    command: sh -c "sleep 10 && bundle exec rails sneakers:run"
    volumes:
      - ./tesseract:/rails
  check-ruler:
    tty: true
    stdin_open: true
    image: check-ruler
    container_name: check-ruler
    build:
      context: ./check-ruler
    ports:
      - "8002:3000"
    env_file:
      ./check-ruler/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./check-ruler:/rails
  check-ruler-sneakers:
    tty: true
    stdin_open: true
    image: check-ruler-sneakers
    container_name: check-ruler-sneakers
    build:
      context: ./check-ruler
    env_file:
      ./check-ruler/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: sh -c "sleep 10 && bundle exec rails sneakers:run"
    volumes:
      - ./check-ruler:/rails
  check-register:
    tty: true
    stdin_open: true
    image: check-register
    container_name: check-register
    build:
      context: ./check-register
    ports:
      - "8003:3000"
    env_file:
      ./check-register/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./check-register:/rails
  check-register-sneakers:
    tty: true
    stdin_open: true
    image: check-register-sneakers
    container_name: check-register-sneakers
    build:
      context: ./check-register
    env_file:
      ./check-register/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
      RABBITMQ_VHOST: '/'
      RABBITMQ_USER: 'guest'
      RABBITMQ_PASSWORD: 'guest'
    depends_on:
      - db
      - rabbitmq
    command: sh -c "sleep 10 && bundle exec rails sneakers:run"
    volumes:
      - ./check-register:/rails
  budget-control:
    tty: true
    stdin_open: true
    image: budget-control
    container_name: budget-control
    build:
      context: ./budget-control
    ports:
      - "8004:3000"
    env_file:
      ./budget-control/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./budget-control:/rails
  budget-control-sneakers:
    tty: true
    stdin_open: true
    image: budget-control-sneakers
    container_name: budget-control-sneakers
    build:
      context: ./budget-control
    env_file:
      ./budget-control/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
    depends_on:
      - db
      - rabbitmq
    command: sh -c "sleep 10 && bundle exec rails sneakers:run"
    volumes:
      - ./budget-control:/rails
  event-logger:
    tty: true
    stdin_open: true
    image: event-logger
    container_name: event-logger
    build:
      context: ./event-logger
    ports:
      - "8005:3000"
    env_file:
      ./event-logger/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
      SNEAKERS_QUEUE: 'event_logger.in'
      SNEAKERS_BINDING_KEY: '#'
      # Журнал получает копию каждого сообщения и в графе зависимостей
      # Zipkin связал бы себя со всеми каналами разом, спрятав за собой
      # сам конвейер. В трассах чеков он при этом остаётся (ADR-0011)
      TRACING_DEPENDENCIES: 'false'
    depends_on:
      - db
      - rabbitmq
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./event-logger:/rails
  event-logger-sneakers:
    tty: true
    stdin_open: true
    image: event-logger-sneakers
    container_name: event-logger-sneakers
    build:
      context: ./event-logger
    env_file:
      ./event-logger/.env
    environment:
      DB_HOST: 'db'
      DB_USER: 'postgres'
      DB_PASSWORD: 'postgres'
      RABBITMQ_HOSTS: 'rabbitmq'
      ZIPKIN_HOST: 'zipkin'
      SNEAKERS_QUEUE: 'event_logger.in'
      SNEAKERS_BINDING_KEY: '#'
      # Журнал получает копию каждого сообщения и в графе зависимостей
      # Zipkin связал бы себя со всеми каналами разом, спрятав за собой
      # сам конвейер. В трассах чеков он при этом остаётся (ADR-0011)
      TRACING_DEPENDENCIES: 'false'
    depends_on:
      - db
      - rabbitmq
    command: sh -c "sleep 10 && bundle exec rails sneakers:run"
    volumes:
      - ./event-logger:/rails

volumes:
  # Очереди и привязки не должны пропадать вместе с контейнером брокера
  rabbitmq-data:
  # История метрик должна переживать перезапуск контейнера Prometheus
  prometheus-data:
  # Дашборды приходят из репозитория, но своё состояние Grafana хранит здесь
  grafana-data:
